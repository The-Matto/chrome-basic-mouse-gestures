<!DOCTYPE html>
<style>
    #overlay-text {
        color: rgb(255, 255, 255);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        border-radius: 15px;
    }

    #overlay {
        position: fixed;
        overflow: visible;
        top: 0px;
        left: 0px;
        z-index: 5000;
        width: 100px;
        height: 50px;
        background-color: black;
        padding: 8px;
        text-align: center;
        border-radius: 15px;
    }

    #overlay-test {
        position: absolute;
        top: -100px;
        left: 150px;
        width: 50px;
        height: 50px;
        background-color: rgb(156, 29, 29);
    }

    #recent-tabs-list {
        position: absolute;
        top: 50px;
        left: 125px;
        width: auto;
        height: auto;
        user-select: none;
        display: flex;
        flex-direction: column;
        gap: 5px;
        list-style: none;
        padding: 0;
        margin: 0;
        align-items: start;
    }

    .recent-tab-item {
        cursor: crosshair;
        user-select: none;
        background-color: rgba(28, 28, 28, 1);
        border: 2px solid rgba(80, 80, 80, 1);
        z-index: 5005;
        width: 200px;
        height: 20px;
        text-align: left;
    }

    .recent-tab-item-title {}
</style>

<div id="overlay">
    <p id="overlay-text">Text</p>

    <!-- <div id="overlay-test">
        <p id="overlay-asd">YT Music</p>
    </div> -->

    <ul id="recent-tabs-list">

    </ul>


    <template id="template-list-item">
        <li class="recent-tab-item">
            <p class="recent-tab-item-title">Tab Name</p>
        </li>
    </template>
</div>
